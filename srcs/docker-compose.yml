services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./secrets:/run/secrets:ro
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
      - ./secrets:/run/secrets:ro
    depends_on:
      - mariadb
    networks:
      - inception


  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception

  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    networks:
      - inception
    restart: always

  adminer:
    build: ./requirements/bonus/adminer
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - inception
    restart: always
    depends_on:
      - mariadb

  static_site:
    build: ./requirements/bonus/static_site
    container_name: static_site
    ports:
      - "4242:4242"
    networks:
      - inception
    restart: always


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/akajjou/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/akajjou/data/wordpress

networks:
  inception:
    driver: bridge